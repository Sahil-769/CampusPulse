services:
  # Development services
  postgres:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: campus_pulse
      POSTGRES_PASSWORD: "wYdYL9S-xrJTjgcErqOc6KGq7nQJF57Z"
    volumes:
      - campus_pulse_data:/var/lib/postgresql/data


  # Test services
  postgres_test:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: campus_pulse_test
      POSTGRES_PASSWORD: "Gu4K1WI39F6Cvk98BwjxzMFbnhL8U8pB"
    volumes:
      - campus_pulse_test_data:/var/lib/postgresql/data


volumes:
  campus_pulse_data:
  campus_pulse_test_data:
